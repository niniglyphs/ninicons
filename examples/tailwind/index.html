<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ninicons · Tailwind CSS</title>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand"><span class="icon-[nini--sparkle-fill]" style="font-size: 22px"></span> Nini Projects</div>
        <a class="nav" href="#" aria-current="page"><span class="icon-[nini--home]" style="font-size: 20px"></span> <span>Home</span></a>
        <a class="nav" href="#"><span class="icon-[nini--search]" style="font-size: 20px"></span> <span>Search</span></a>
        <a class="nav" href="#"><span class="icon-[nini--bell]" style="font-size: 20px"></span> <span>Inbox</span></a>
        <a class="nav" href="#"><span class="icon-[nini--heart]" style="font-size: 20px"></span> <span>Saved</span></a>
        <a class="nav" href="#"><span class="icon-[nini--gear]" style="font-size: 20px"></span> <span>Settings</span></a>
      </aside>
      <main class="main">
        <div class="head">
          <h1>Projects</h1>
          <button class="button"><span class="icon-[nini--plus-bold]" style="font-size: 18px"></span> New project</button>
        </div>
        <section class="cards">
          <article class="card">
            <div class="mark"><span class="icon-[nini--rocket-duotone]" style="font-size: 26px"></span></div>
            <h2>Launch plan</h2>
            <div class="when"><span class="icon-[nini--clock]" style="font-size: 16px"></span> 2 days left</div>
          </article>
          <article class="card">
            <div class="mark"><span class="icon-[nini--leaf-duotone]" style="font-size: 26px"></span></div>
            <h2>Garden club</h2>
            <div class="when"><span class="icon-[nini--clock]" style="font-size: 16px"></span> Next week</div>
          </article>
          <article class="card">
            <div class="mark"><span class="icon-[nini--coffee-duotone]" style="font-size: 26px"></span></div>
            <h2>Morning notes</h2>
            <div class="when"><span class="icon-[nini--clock]" style="font-size: 16px"></span> Today</div>
          </article>
        </section>
        <section>
          <p class="label">One icon, seven weights</p>
          <div class="weights">
            <div class="weight"><span class="icon-[nini--rocket-thin]" style="font-size: 32px"></span> thin</div>
            <div class="weight"><span class="icon-[nini--rocket-light]" style="font-size: 32px"></span> light</div>
            <div class="weight"><span class="icon-[nini--rocket]" style="font-size: 32px"></span> regular</div>
            <div class="weight"><span class="icon-[nini--rocket-semibold]" style="font-size: 32px"></span> semibold</div>
            <div class="weight"><span class="icon-[nini--rocket-bold]" style="font-size: 32px"></span> bold</div>
            <div class="weight"><span class="icon-[nini--rocket-fill]" style="font-size: 32px"></span> fill</div>
            <div class="weight"><span class="icon-[nini--rocket-duotone]" style="font-size: 32px"></span> duotone</div>
          </div>
        </section>
        <p class="foot">Drawn with Tailwind CSS and @ninicons/iconify.</p>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
