<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ninicons · icon font</title>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand"><i class="nini-fill nini-sparkle" style="font-size: 22px"></i> Nini Projects</div>
        <a class="nav" href="#" aria-current="page"><i class="nini nini-home" style="font-size: 20px"></i> <span>Home</span></a>
        <a class="nav" href="#"><i class="nini nini-search" style="font-size: 20px"></i> <span>Search</span></a>
        <a class="nav" href="#"><i class="nini nini-bell" style="font-size: 20px"></i> <span>Inbox</span></a>
        <a class="nav" href="#"><i class="nini nini-heart" style="font-size: 20px"></i> <span>Saved</span></a>
        <a class="nav" href="#"><i class="nini nini-gear" style="font-size: 20px"></i> <span>Settings</span></a>
      </aside>
      <main class="main">
        <div class="head">
          <h1>Projects</h1>
          <button class="button"><i class="nini-bold nini-plus" style="font-size: 18px"></i> New project</button>
        </div>
        <section class="cards">
          <article class="card">
            <div class="mark"><i class="nini-duotone nini-rocket" style="font-size: 26px"></i></div>
            <h2>Launch plan</h2>
            <div class="when"><i class="nini nini-clock" style="font-size: 16px"></i> 2 days left</div>
          </article>
          <article class="card">
            <div class="mark"><i class="nini-duotone nini-leaf" style="font-size: 26px"></i></div>
            <h2>Garden club</h2>
            <div class="when"><i class="nini nini-clock" style="font-size: 16px"></i> Next week</div>
          </article>
          <article class="card">
            <div class="mark"><i class="nini-duotone nini-coffee" style="font-size: 26px"></i></div>
            <h2>Morning notes</h2>
            <div class="when"><i class="nini nini-clock" style="font-size: 16px"></i> Today</div>
          </article>
        </section>
        <section>
          <p class="label">One icon, seven weights</p>
          <div class="weights">
            <div class="weight"><i class="nini-thin nini-rocket" style="font-size: 32px"></i> thin</div>
            <div class="weight"><i class="nini-light nini-rocket" style="font-size: 32px"></i> light</div>
            <div class="weight"><i class="nini nini-rocket" style="font-size: 32px"></i> regular</div>
            <div class="weight"><i class="nini-semibold nini-rocket" style="font-size: 32px"></i> semibold</div>
            <div class="weight"><i class="nini-bold nini-rocket" style="font-size: 32px"></i> bold</div>
            <div class="weight"><i class="nini-fill nini-rocket" style="font-size: 32px"></i> fill</div>
            <div class="weight"><i class="nini-duotone nini-rocket" style="font-size: 32px"></i> duotone</div>
          </div>
        </section>
        <p class="foot">Drawn with @ninicons/font.</p>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
