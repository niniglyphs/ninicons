<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ninicons · SVG sprite</title>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand"><svg width="22" height="22"><use data-icon="fill:sparkle"/></svg> Nini Projects</div>
        <a class="nav" href="#" aria-current="page"><svg width="20" height="20"><use data-icon="regular:home"/></svg> <span>Home</span></a>
        <a class="nav" href="#"><svg width="20" height="20"><use data-icon="regular:search"/></svg> <span>Search</span></a>
        <a class="nav" href="#"><svg width="20" height="20"><use data-icon="regular:bell"/></svg> <span>Inbox</span></a>
        <a class="nav" href="#"><svg width="20" height="20"><use data-icon="regular:heart"/></svg> <span>Saved</span></a>
        <a class="nav" href="#"><svg width="20" height="20"><use data-icon="regular:gear"/></svg> <span>Settings</span></a>
      </aside>
      <main class="main">
        <div class="head">
          <h1>Projects</h1>
          <button class="button"><svg width="18" height="18"><use data-icon="bold:plus"/></svg> New project</button>
        </div>
        <section class="cards">
          <article class="card">
            <div class="mark"><svg width="26" height="26"><use data-icon="duotone:rocket"/></svg></div>
            <h2>Launch plan</h2>
            <div class="when"><svg width="16" height="16"><use data-icon="regular:clock"/></svg> 2 days left</div>
          </article>
          <article class="card">
            <div class="mark"><svg width="26" height="26"><use data-icon="duotone:leaf"/></svg></div>
            <h2>Garden club</h2>
            <div class="when"><svg width="16" height="16"><use data-icon="regular:clock"/></svg> Next week</div>
          </article>
          <article class="card">
            <div class="mark"><svg width="26" height="26"><use data-icon="duotone:coffee"/></svg></div>
            <h2>Morning notes</h2>
            <div class="when"><svg width="16" height="16"><use data-icon="regular:clock"/></svg> Today</div>
          </article>
        </section>
        <section>
          <p class="label">One icon, seven weights</p>
          <div class="weights">
            <div class="weight"><svg width="32" height="32"><use data-icon="thin:rocket"/></svg> thin</div>
            <div class="weight"><svg width="32" height="32"><use data-icon="light:rocket"/></svg> light</div>
            <div class="weight"><svg width="32" height="32"><use data-icon="regular:rocket"/></svg> regular</div>
            <div class="weight"><svg width="32" height="32"><use data-icon="semibold:rocket"/></svg> semibold</div>
            <div class="weight"><svg width="32" height="32"><use data-icon="bold:rocket"/></svg> bold</div>
            <div class="weight"><svg width="32" height="32"><use data-icon="fill:rocket"/></svg> fill</div>
            <div class="weight"><svg width="32" height="32"><use data-icon="duotone:rocket"/></svg> duotone</div>
          </div>
        </section>
        <p class="foot">Drawn with the @ninicons/core sprites.</p>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
